# this is a basic workflow called "ci"
# a workflow is triggered when an event occurs in a Github repo
# for this specific working, the event is a "pull request" into "main"
name: ci

on:
  pull_request:
    branches: [main]

# a workflow is made up of one or more jobs.
# a job is a set of steps that run on the same "runner", which is a VM
# that run the "job" on Github's servers.
#
# questions:
# - is "tests" a special keyword for github actions?
# - if multiple jobs are defined, will they run in parallel?
# - how does Github's servers support this, i mean thousands if not million of projects are running their CIs at the same time, do they have unlimited servers or what?
# - what does "check out code" mean?
# - what is "actions/", and where does it come from?
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Go version
        run: go version
